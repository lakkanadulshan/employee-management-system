<div class="container my-4">
  <!-- Top Bar: Header & Add New / Close Button -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0 text-primary">Employee Management</h2>
    
    <button 
      type="button" 
      [class]="isFormVisible() ? 'btn btn-secondary' : 'btn btn-danger'" 
      (click)="isFormVisible.set(!isFormVisible())">
      <i [class]="isFormVisible() ? 'fa fa-times me-1' : 'fa fa-plus me-1'"></i>
      {{ isFormVisible() ? 'Close' : 'Add New' }}
    </button>
  </div>

  <!-- Employee Form (Visible only when isFormVisible is true) -->
  @if (isFormVisible()) {
    <div class="card shadow-sm p-4 mb-4 border">
      <h4 class="mb-3 text-secondary">New Employee Details</h4>
      
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="employeeName" class="form-label">Employee Name</label>
            <input type="text" class="form-control" id="employeeName" placeholder="Enter employee name">
          </div>
          <div class="col-md-6">
            <label for="contactNo" class="form-label">Contact No</label>
            <input type="text" class="form-control" id="contactNo" placeholder="Enter contact number">
          </div>

          <div class="col-md-6">
            <label for="emailId" class="form-label">Email</label>
            <input type="email" class="form-control" id="emailId" placeholder="Enter email">
          </div>
          <div class="col-md-6">
  <label for="parentDeptId" class="form-label">Parent Department</label>
  <select id="parentDeptId" class="form-select">
    <option value="" selected disabled>Select department</option>
    @for (dept of ParentDepartmentsList(); track dept.departmentId) {
      <option [value]="dept.departmentId">{{ dept.departmentName }}</option>
    }
  </select>
</div>
          <div class="col-md-6">
            <label for="deptId" class="form-label">Child Department</label>
            <select id="deptId" class="form-select">
              <option selected>Select department</option>
              <!-- Department options go here -->
            </select>
          </div>

          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password">
          </div>
          <div class="col-md-6">
            <label for="role" class="form-label">Role</label>
            <input type="text" class="form-control" id="role" placeholder="Enter role">
          </div>

          <div class="col-md-6">
            <label for="gender" class="form-label">Gender</label>
            <select id="gender" class="form-select">
              <option selected>Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="button" class="btn btn-outline-secondary" (click)="isFormVisible.set(false)">Cancel</button>
        </div>
      </form>
    </div>
  }

  <!-- Employee Table -->
  <div class="card shadow-sm p-3">
    <h3 class="h5 mb-3">Employee List</h3>
    <table class="table table-bordered table-striped align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Contact No</th>
          <th>Email</th>
          <th>Department</th>
          <th>Role</th>
          <th>Gender</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data rows go here -->
      </tbody>
    </table>
  </div>
</div>
